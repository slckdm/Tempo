server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    client_max_body_size 0;

    location / {
        try_files $uri $uri/ /index.html;
    }


    location /api/management/ {
        # set $upstream_management http://tempo.management.backend:8080;
        set $upstream_management http://host.docker.internal:8001;
        rewrite ^/api/management/(.*)$ /$1 break;
        proxy_pass $upstream_management;
    }

    location /api/streaming/ {
        # set $upstream_streaming http://tempo.streaming.backend:8080;
        set $upstream_streaming http://host.docker.internal:8002;
        rewrite ^/api/streaming/(.*)$ /$1 break;
        proxy_pass $upstream_streaming;
    }

    location /api/metadata/ {
        # set $upstream_metadata http://tempo.metadata.backend:8080;
        set $upstream_metadata http://host.docker.internal:8003;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_metadata;
    }

    location /api/library/ {
        # set $upstream_library http://tempo.library.backend:8080;
        set $upstream_library http://host.docker.internal:8004;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_library;
    }

    location /api/auth/ {
        set $upstream_auth http://local_keycloak:8080;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $upstream_auth;
    }

    # Direct-to-S3 uploads: the presigned URL is signed by the management service
    # against the S3 endpoint *it* can reach (the MinIO container hostname), which
    # the browser can't resolve. Proxy the PUT to MinIO and forward the exact,
    # un-decoded path/query (via $request_uri) plus the signed Host, so the SigV4
    # signature still validates. Frontend rewrites the presigned URL to /api/s3/*.
    location /api/s3/ {
        # Literal proxy_pass with a trailing slash strips the /api/s3/ prefix and
        # forwards the remaining path + query *verbatim* (a variable in proxy_pass
        # would re-encode the already-encoded key, e.g. %3A -> %253A, and break the
        # signature). Host must equal the host the URL was signed against.
        proxy_pass http://local-s3-minio:9000/;
        proxy_set_header Host local-s3-minio:9000;
    }
}
