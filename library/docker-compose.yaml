services:
  library-backend:
    container_name: tempo.library.backend
    build:
      context: .
      target: backend
      network: host
    env_file:
      - .dev/.env.docker.local
    networks:
      - local-network
    ports:
      - 8004:8080

networks:
  local-network:
    name: local.network
    external: true
