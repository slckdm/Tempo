[project]
name = "streaming"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.137.1,<0.138.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "dishka (>=1.10.1,<2.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)"
]

[tool.uv.sources]
toolkit = { workspace = true }

[tool.uv.workspace]
members = ["../toolkit"]

[dependency-groups]
local = [
    "toolkit",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
