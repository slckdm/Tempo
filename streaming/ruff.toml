line-length = 99
indent-width = 4

target-version = "py314"

[lint]
select = ["E", "W", "F", "Q", "I", "D"]
ignore = [
    "F401", # imported but unused
    "Q003", # escaping quotes
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[lint.pydocstyle]
convention = "google"

[lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"


[lint.isort.sections]
frameworks = ["fastapi"]
libs = ["tempo_toolkit"]
[lint.isort]
section-order = [
    "standard-library",
    "frameworks",
    "third-party",
    "libs",
    "first-party",
    "local-folder",
]
