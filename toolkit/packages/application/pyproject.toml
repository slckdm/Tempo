[project]
name = "tempo-toolkit-application"
version = "0.2.21"
description = "Framework-independent application building blocks for Tempo"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4,<3.0.0",
    "tempo-toolkit-contracts==0.2.21",
]

[tool.uv.sources]
tempo-toolkit-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tempo_toolkit.application"
