[project]
name = "tempo-toolkit-contracts"
version = "0.2.1"
description = "Stable cross-service contracts for Tempo"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.13.4,<3.0.0"]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tempo_toolkit.contracts"
